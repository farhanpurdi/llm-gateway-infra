name: Security Scan

on:
  pull_request:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          LITELLM_BASE_URL=http://localhost:4000
          LITELLM_MASTER_KEY=ci-master-placeholder
          LITELLM_SALT_KEY=ci-salt-placeholder

          POSTGRES_DB=litellm
          POSTGRES_USER=litellm
          POSTGRES_PASSWORD=ci-postgres-placeholder

          DATABASE_URL=postgresql://litellm:ci-postgres-placeholder@postgres:5432/litellm

          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=

          OPENAI_API_KEY=ci-provider-placeholder

          LLM_GATEWAY_CONFIG_DIR=../llm-gateway-config
          LITELLM_CONFIG_PATH=.github/fixtures/litellm_config.yaml

          HEALTHCHECK_API_KEY=ci-healthcheck-placeholder
          EOF

      - name: Run security checks
        run: |
          ./scripts/security/check-all.sh